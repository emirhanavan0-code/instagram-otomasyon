name: Instagram'da yayınla

# Onaylanmış (main dalındaki) içerikleri zamanı gelince paylaşır.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: yayinla

permissions:
  contents: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Zamanı gelenleri yayınla
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python yayinla.py
      - name: Durumu kaydet
        run: |
          git config user.name "seovedijital-bot"
          git config user.email "bot@users.noreply.github.com"
          git add icerik
          git diff --cached --quiet || (git commit -m "Yayın durumu güncellendi" && (git push || (git pull --rebase && git push)))
