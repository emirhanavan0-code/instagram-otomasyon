name: Haftalık performans raporu

on:
  schedule:
    - cron: "0 5 * * 5"   # Cuma 08:00 (TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Analiz
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python ig.py analiz
      - name: Raporu kaydet
        run: |
          git config user.name "seovedijital-bot"
          git config user.email "bot@users.noreply.github.com"
          git add raporlar
          git diff --cached --quiet || (git commit -m "Haftalık rapor" && git push)
