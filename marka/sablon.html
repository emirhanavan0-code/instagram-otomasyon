<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fontlar.css">
<style>
  /* seovedijital.com tasarım dili: koyu zemin, ince ızgara, mavi-mor vurgu, kartlar */
  :root {
    --bg: #04050A; --kart: #0A0D1B; --ink: #FFFFFF; --muted: #A8AEBF; --soft: #D5D9E6;
    --mavi: #9AA6FF; --mor: #C9A2FF; --line: rgba(255,255,255,.08);
    --grad: linear-gradient(90deg, var(--mavi) 0%, var(--mor) 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  #sahne {
    position: relative; overflow: hidden; color: var(--ink);
    font-family: 'DM Sans', sans-serif; background: var(--bg);
    display: flex; flex-direction: column; padding: 84px 84px 72px;
    -webkit-font-smoothing: antialiased;
  }
  #sahne.post  { width: 1080px; height: 1350px; }
  #sahne.reels { width: 1080px; height: 1920px; padding: 220px 90px 300px; }

  /* Arka plan: sitedeki ızgara + mavi/mor ışık */
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,.035) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.035) 1.5px, transparent 1.5px);
    background-size: 108px 108px; mask-image: linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent); }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  .glow.a { width: 900px; height: 900px; background: radial-gradient(circle, rgba(91,106,255,.9), transparent 65%); top: 18%; left: -460px; opacity: .45; }
  .glow.b { width: 700px; height: 700px; background: radial-gradient(circle, rgba(181,124,255,.8), transparent 65%); top: -380px; right: -320px; opacity: .28; }

  header, footer, main { position: relative; z-index: 2; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .marka { display: flex; align-items: center; gap: 18px; font-family: 'Sora'; font-weight: 700; font-size: 32px; letter-spacing: -.5px; }
  .marka img { width: 58px; height: 58px; }
  .sayfa { font-family: 'Sora'; font-weight: 600; font-size: 24px; color: var(--muted); border: 1.5px solid var(--line); background: rgba(255,255,255,.03); padding: 10px 22px; border-radius: 99px; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .ust { font-family: 'Sora'; font-weight: 600; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: var(--mavi); margin-bottom: 36px; }
  h1 { font-family: 'Sora'; font-weight: 800; font-size: 100px; line-height: 1.04; letter-spacing: -.035em; }
  h2 { font-family: 'Sora'; font-weight: 800; font-size: 70px; line-height: 1.08; letter-spacing: -.03em; }
  em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .alt { font-size: 38px; line-height: 1.55; color: var(--muted); margin-top: 40px; max-width: 860px; }
  .metin { font-size: 38px; line-height: 1.55; color: var(--muted); margin-top: 30px; }
  .metin b { color: var(--ink); font-weight: 700; }
  .cizgi { width: 120px; height: 6px; border-radius: 6px; background: var(--grad); margin-top: 52px; }

  /* Hizmet kartı (sitedeki numaralı kartlar) */
  .kart { position: relative; overflow: hidden; border-radius: 44px; padding: 3px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--c) 70%, transparent), rgba(255,255,255,.06) 40%, rgba(255,255,255,.04)); }
  .kart-ic { position: relative; border-radius: 41px; background: var(--kart); padding: 60px 56px 64px; overflow: hidden; }
  .kart-ic::before { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; top: -260px; left: -200px;
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
  .kart-ic > * { position: relative; }
  .kart-ust { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 44px; }
  .ikon { width: 96px; height: 96px; border-radius: 26px; background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.10);
    display: grid; place-items: center; color: var(--c); }
  .ikon svg { width: 44px; height: 44px; }
  .no { font-family: 'Sora'; font-weight: 800; font-size: 150px; line-height: .8; letter-spacing: -.05em; color: rgba(255,255,255,.07); }
  .cipler { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 44px; }
  .cip { display: flex; align-items: center; gap: 16px; font-size: 30px; line-height: 1.25; color: var(--soft);
    background: rgba(255,255,255,.03); border: 1.5px solid rgba(255,255,255,.09); border-radius: 18px; padding: 20px 22px; }
  .cip::before { content: "✓"; color: #4ADE80; font-weight: 700; flex: none; }
  .cipler.tek { grid-template-columns: 1fr; }

  .rakam { font-family: 'Sora'; font-weight: 800; font-size: 260px; line-height: .9; letter-spacing: -.05em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rakam-etiket { font-family: 'Sora'; font-weight: 700; font-size: 50px; margin-top: 20px; }

  /* Çağrı: sitedeki beyaz buton + mavi bağlantı */
  .cta-alt { font-size: 38px; line-height: 1.55; color: var(--muted); margin-top: 36px; max-width: 860px; }
  .butonlar { display: flex; align-items: center; gap: 44px; margin-top: 64px; flex-wrap: wrap; }
  .buton { font-family: 'Sora'; font-weight: 700; font-size: 38px; color: #05060C; background: #fff; border-radius: 28px; padding: 32px 48px;
    box-shadow: 0 20px 60px rgba(154,166,255,.25); }
  .bag { font-family: 'Sora'; font-weight: 700; font-size: 36px; color: var(--mavi); }
  .iletisim { display: flex; gap: 40px; margin-top: 56px; padding-top: 44px; border-top: 1.5px solid var(--line); font-size: 32px; color: var(--muted); }
  .iletisim b { color: var(--ink); font-weight: 700; }

  footer { display: flex; align-items: center; justify-content: space-between; font-size: 28px; color: var(--muted); }
  .kaydir { font-family: 'Sora'; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 14px; }
  .kaydir i { font-style: normal; display: inline-grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: #fff; color: #05060C; font-size: 30px; }
  .ilerleme { position: absolute; left: 90px; right: 90px; top: 150px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); z-index: 3; overflow: hidden; }
  .ilerleme div { height: 100%; background: var(--grad); width: 0; }

  /* Reels sahne geçişleri: her öğe sırayla belirir */
  .reels .anim { opacity: 0; transform: translateY(60px); animation: gir .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .reels h1 { font-size: 108px; }
  .reels h2 { font-size: 80px; }
  .reels .metin, .reels .alt, .reels .cta-alt { font-size: 44px; }
  .reels .cip { font-size: 34px; }

  /* Kısa not: güncel haber kartı, kaynak satırıyla */
  .not-ust { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; font-family: 'Sora'; font-weight: 600; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; }
  .not-ust .rozet { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; color: #05060C; background: #fff; padding: 12px 22px; border-radius: 99px; letter-spacing: .12em; }
  .not-ust .rozet::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #FF6A2B; box-shadow: 0 0 0 6px rgba(255,106,43,.25); }
  .not-ust .konu { color: var(--mavi); }
  .not-ust .tarih { flex: none; white-space: nowrap; margin-left: auto; color: var(--muted); letter-spacing: .06em; }
  .anlami { margin-top: 44px; padding: 34px 38px; border-radius: 28px; background: rgba(154,166,255,.07); border: 1.5px solid rgba(154,166,255,.22); }
  .anlami small { display: block; font-family: 'Sora'; font-weight: 700; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--mavi); margin-bottom: 14px; }
  .anlami p { font-size: 34px; line-height: 1.5; color: var(--soft); }
  .kaynak { margin-top: 36px; font-size: 28px; color: var(--muted); }
  .kaynak b { color: var(--ink); font-weight: 700; }

  /* Stil varyasyonları: içerikte "stil" ile seçilir; renk + reels giriş hareketi değişir */
  #sahne { --grad: linear-gradient(90deg, var(--mavi) 0%, var(--mor) 100%); }
  #sahne.s-kor    { --mavi: #FF9A6B; --mor: #FF4D6D; }
  #sahne.s-zumrut { --mavi: #4FD1C5; --mor: #8BF2A8; }
  #sahne.s-gece   { --mavi: #C9A2FF; --mor: #FF7AC6; }
  #sahne.s-altin  { --mavi: #FFD27A; --mor: #FF9F43; }
  #sahne.s-kor .glow.a    { background: radial-gradient(circle, rgba(255,106,43,.9), transparent 65%); }
  #sahne.s-kor .glow.b    { background: radial-gradient(circle, rgba(255,61,109,.8), transparent 65%); }
  #sahne.s-zumrut .glow.a { background: radial-gradient(circle, rgba(40,190,170,.85), transparent 65%); }
  #sahne.s-zumrut .glow.b { background: radial-gradient(circle, rgba(120,230,150,.6), transparent 65%); }
  #sahne.s-gece .glow.a   { background: radial-gradient(circle, rgba(150,90,255,.9), transparent 65%); }
  #sahne.s-gece .glow.b   { background: radial-gradient(circle, rgba(255,90,190,.7), transparent 65%); }
  #sahne.s-altin .glow.a  { background: radial-gradient(circle, rgba(255,170,60,.8), transparent 65%); }
  #sahne.s-altin .glow.b  { background: radial-gradient(circle, rgba(255,220,120,.6), transparent 65%); }
  #sahne.reels.s-kor .anim    { animation-name: gir-sol; }
  #sahne.reels.s-zumrut .anim { animation-name: gir-olcek; }
  #sahne.reels.s-gece .anim   { animation-name: gir-bulanik; }
  #sahne.reels.s-altin .anim  { animation-name: gir-ust; }
  @keyframes gir-sol { from { opacity: 0; transform: translateX(-90px); } to { opacity: 1; transform: none; } }
  @keyframes gir-olcek { from { opacity: 0; transform: scale(.88); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes gir-bulanik { from { opacity: 0; filter: blur(24px); letter-spacing: .02em; } to { opacity: 1; filter: none; } }
  @keyframes gir-ust { from { opacity: 0; transform: translateY(-70px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
  @keyframes gir { to { opacity: 1; transform: none; } }
  @keyframes doldur { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<div id="sahne"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// *vurgu* → mavi-mor gradyan, **kalın** → beyaz kalın
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");

const RENKLER = ["#6D7BFF", "#B57CFF", "#FF6A2B", "#4FD1C5"];
const IKONLAR = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="2.5"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>',
];

const govde = {
  kapak: s => `
    ${s.ust ? `<div class="ust anim">${esc(s.ust)}</div>` : ""}
    <h1 class="anim">${md(s.baslik)}</h1>
    ${s.alt ? `<p class="alt anim">${md(s.alt)}</p>` : ""}
    <div class="cizgi anim"></div>`,
  madde: s => {
    const i = (Number(s.no) - 1 + RENKLER.length) % RENKLER.length;
    return `
    <div class="kart anim" style="--c:${RENKLER[i]}"><div class="kart-ic">
      <div class="kart-ust"><div class="ikon">${IKONLAR[i]}</div><div class="no">${String(s.no).padStart(2, "0")}</div></div>
      <h2>${md(s.baslik)}</h2>
      ${s.metin ? `<p class="metin">${md(s.metin)}</p>` : ""}
      ${s.liste ? `<div class="cipler${s.liste.some(l => l.length > 22) ? " tek" : ""}">${s.liste.map(l => `<div class="cip">${md(l)}</div>`).join("")}</div>` : ""}
    </div></div>`;
  },
  rakam: s => `
    ${s.ust ? `<div class="ust anim">${esc(s.ust)}</div>` : ""}
    <div class="rakam anim">${esc(s.rakam)}</div>
    <div class="rakam-etiket anim">${md(s.etiket)}</div>
    ${s.metin ? `<p class="metin anim">${md(s.metin)}</p>` : ""}`,
  alinti: s => `
    <div class="kart anim" style="--c:#6D7BFF"><div class="kart-ic">
      ${s.ust ? `<div class="ust">${esc(s.ust)}</div>` : ""}
      <h2>${md(s.baslik)}</h2>
      ${s.metin ? `<p class="metin">${md(s.metin)}</p>` : ""}
    </div></div>`,
  not: s => `
    <div class="not-ust anim"><span class="rozet">Kısa Not</span>${s.ust ? `<span class="konu">${esc(s.ust)}</span>` : ""}${s.tarih ? `<span class="tarih">${esc(s.tarih)}</span>` : ""}</div>
    <h2 class="anim">${md(s.baslik)}</h2>
    ${s.metin ? `<p class="metin anim">${md(s.metin)}</p>` : ""}
    ${s.anlami ? `<div class="anlami anim"><small>Sizin için anlamı</small><p>${md(s.anlami)}</p></div>` : ""}
    ${s.kaynak ? `<p class="kaynak anim">Kaynak: <b>${esc(s.kaynak)}</b></p>` : ""}`,
  cta: s => `
    ${s.ust ? `<div class="ust anim">${esc(s.ust)}</div>` : ""}
    <h2 class="anim">${md(s.baslik || "Markanızı *büyütmeye* hazır mısınız?")}</h2>
    ${s.aciklama ? `<p class="cta-alt anim">${md(s.aciklama)}</p>` : ""}
    <div class="butonlar anim"><span class="buton">${esc(s.eylem || "seovedijital.com")} ↗</span></div>
    <div class="iletisim anim"><span>📞 <b>0501 048 3732</b></span><span>📍 <b>Ankara</b></span></div>`,
};

window.ciz = (slayt, { format = "post", sira = 1, toplam = 1, sure = 0, stil = "" } = {}) => {
  const el = document.getElementById("sahne");
  el.className = format + (stil ? " s-" + stil : "");
  const sonMu = sira === toplam;
  el.innerHTML = `
    <div class="grid"></div><div class="glow a"></div><div class="glow b"></div>
    ${format === "reels" && sure ? `<div class="ilerleme"><div style="animation: doldur ${sure}s linear forwards"></div></div>` : ""}
    <header>
      <div class="marka"><img src="logo.png" alt="">seovedijital</div>
      ${toplam > 1 && format === "post" ? `<div class="sayfa">${sira} / ${toplam}</div>` : ""}
    </header>
    <main>${govde[slayt.tip](slayt)}</main>
    <footer>
      <span>@seovedijital</span>
      ${format === "post" && toplam > 1 && !sonMu ? `<span class="kaydir">Kaydır <i>→</i></span>` : `<span>SEO · GEO · Trendyol</span>`}
    </footer>`;
  // Reels: öğeleri sırayla canlandır
  el.querySelectorAll(".anim").forEach((a, i) => (a.style.animationDelay = `${0.15 + i * 0.25}s`));
  return document.fonts.ready.then(() => Promise.all([...el.querySelectorAll("img")].map(i => i.decode().catch(() => {}))));
};
</script>
</body>
</html>
